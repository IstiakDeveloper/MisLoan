name: Verify

on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_call:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, xml, dom, zip, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: cp .env.example .env
      - run: composer install --prefer-dist --no-interaction
      - run: composer audit --locked
      - run: php artisan key:generate
      - run: npm ci
      - name: Accounting and security regressions
        run: php artisan test tests/Unit/AccountingFoundationTest.php tests/Unit/PortableMigrationDataTest.php tests/Unit/ProductLoanPricingTest.php tests/Unit/LoanDisbursementDateTest.php tests/Unit/LoanAmountChangeReapprovalTest.php tests/Unit/MaintenanceRouteSecurityTest.php tests/Unit/SavingsAccessSecurityTest.php tests/Unit/PwaUpdateTest.php
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
      - name: Full test suite
        id: tests
        run: php artisan test --log-junit tests.xml
      - name: TypeScript checks
        if: always()
        id: types
        run: npm run types > types.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-diagnostics
          path: |
            tests.xml
            types.log
      - name: Report failed verification gates
        if: always() && (steps.tests.outcome == 'failure' || steps.types.outcome == 'failure')
        run: echo 'Required test/type checks failed. Deployment is blocked until all checks pass.' >> "$GITHUB_STEP_SUMMARY"

  mysql:
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: misloan_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: misloan_test
      DB_USERNAME: root
      DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, xml, dom, zip, gd
          coverage: none
      - run: cp .env.example .env
      - run: composer install --prefer-dist --no-interaction
      - run: php artisan key:generate
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build
      - name: MySQL migration and financial feature coverage
        run: php artisan test tests/Feature
